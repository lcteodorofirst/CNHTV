<h2 mat-dialog-title>Configurar TV</h2>
<mat-dialog-content>
  <form class="form" [formGroup]="form">
    <div class="device-summary">
      <mat-icon>tv</mat-icon>
      <div><strong>{{ device.Name }}</strong><small>{{ device.DeviceKey }} · {{ device.IpAddress || 'Sem IP' }}</small></div>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Nome do equipamento</mat-label>
      <input matInput formControlName="Name" maxlength="100">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>URL da página apresentada</mat-label>
      <input matInput formControlName="PresentationUrl" maxlength="2048">
      <mat-hint>Utilize uma página HTTPS compatível com exibição incorporada.</mat-hint>
    </mat-form-field>
    <mat-checkbox formControlName="RefreshEnabled">Recarregar a página automaticamente</mat-checkbox>
    <mat-form-field appearance="outline">
      <mat-label>Intervalo de refresh (minutos)</mat-label>
      <input matInput type="number" step="0.5" formControlName="RefreshIntervalMinutes">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Cancelar</button>
  <button mat-flat-button type="button" [disabled]="saving" (click)="submit()">Salvar</button>
</mat-dialog-actions>
